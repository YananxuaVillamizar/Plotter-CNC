name: "Plotter_CNC_A4"
board: "ESP32"

stepping:
  engine: RMT
  idle_ms: 255

axes:
  x:
    steps_per_mm: 100.000
    max_rate_mm_per_min: 300.000
    acceleration_mm_per_sec2: 25.000
    max_travel_mm: 210.000
    motor0:
      unipolar:
        phase0_pin: gpio.26
        phase1_pin: gpio.27
        phase2_pin: gpio.14
        phase3_pin: gpio.13
        half_step: true

  y:
    steps_per_mm: 100.000
    max_rate_mm_per_min: 300.000
    acceleration_mm_per_sec2: 25.000
    max_travel_mm: 297.000
    motor0:
      unipolar:
        phase0_pin: gpio.23
        phase1_pin: gpio.22
        phase2_pin: gpio.21
        phase3_pin: gpio.19
        half_step: true

  z:
    steps_per_mm: 100.000
    max_rate_mm_per_min: 300.000
    acceleration_mm_per_sec2: 25.000
    max_travel_mm: 50.000
    motor0:
      unipolar:
        phase0_pin: gpio.18
        phase1_pin: gpio.17
        phase2_pin: gpio.16
        phase3_pin: gpio.4
        half_step: true